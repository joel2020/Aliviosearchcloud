openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Alivio Search Cloud customer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and current user
  - name: businesses
    description: Business workspace operations
  - name: agents
    description: AI agent execution
  - name: agent-runs
    description: Agent run history
  - name: status
    description: Service status
  - name: admin
    description: Admin-only endpoints
  - name: dashboard
    description: Customer dashboard summary
  - name: search
    description: Cross-workspace search
  - name: assistant
    description: Business Assistant chat
  - name: config
    description: Public runtime configuration
  - name: messaging
    description: Twilio WhatsApp/SMS channel connections and inbound webhook
  - name: blog
    description: Public blog endpoints (newsletter signup)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /status:
    get:
      operationId: getStatus
      tags: [status]
      summary: Service status overview
      description: Returns the configured/connected status of every backing service. Never returns secret values.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /businesses/current:
    get:
      operationId: getCurrentBusiness
      tags: [businesses]
      summary: Current business workspace
      responses:
        "200":
          description: Current business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCurrentBusiness
      tags: [businesses]
      summary: Update the current business workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessBody"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all available agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent metadata including dynamic form fields
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "400":
          description: Invalid params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search agents, runs, conversations, and settings
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/{id}/run:
    post:
      operationId: runAgent
      tags: [agents]
      summary: Run an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAgentRequest"
      responses:
        "200":
          description: Agent run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs:
    get:
      operationId: listAgentRuns
      tags: [agent-runs]
      summary: List recent agent runs for the current business
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        "200":
          description: Agent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs/{id}:
    get:
      operationId: getAgentRun
      tags: [agent-runs]
      summary: Single agent run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      tags: [assistant]
      summary: List the current user's assistant conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantConversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAssistantConversation
      tags: [assistant]
      summary: Create a new assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssistantConversationInput"
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/conversations/{id}:
    get:
      operationId: getAssistantConversation
      tags: [assistant]
      summary: Get a single conversation with all of its messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAssistantConversation
      tags: [assistant]
      summary: Soft-delete a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/conversations/{id}/messages:
    post:
      operationId: postAssistantMessage
      tags: [assistant]
      summary: Send a user message and get the assistant reply
      description: |
        Persists the user message, runs the Business Assistant agent against
        full business context (business profile + recent agent runs +
        conversation history), persists the assistant reply, and returns the
        updated message pair.

        When `?stream=1` is passed, the endpoint responds with a
        `text/event-stream` SSE body that emits the following events:
          - `user_message` — the persisted user row
          - `chunk` — `{ delta: string }` for each token
          - `assistant_message` — the persisted assistant row
          - `done` — `{ conversation, suggestedActions }`
          - `error` — `{ error, message }` (e.g. `assistant_not_configured`)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: stream
          required: false
          description: When set to `1`, response is a `text/event-stream` SSE body.
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAssistantMessageInput"
      responses:
        "200":
          description: User + assistant message pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMessagePairResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Assistant not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /config/public:
    get:
      operationId: getPublicConfig
      tags: [config]
      summary: Public runtime configuration
      description: |
        Returns the small set of public values the frontend needs to render
        marketing CTAs (Stripe payment links, Cal.com booking link) along
        with a per-service `configured | not_configured` status flag.
        Never returns secret values such as `STRIPE_SECRET_KEY`.
      responses:
        "200":
          description: Public configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfig"
  /messaging/connections:
    get:
      operationId: listMessagingConnections
      tags: [messaging]
      summary: List the current business's channel connections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessagingConnection"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMessagingConnection
      tags: [messaging]
      summary: Start a new WhatsApp/SMS channel connection (sends OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessagingConnectionInput"
      responses:
        "200":
          description: Pending connection (OTP sent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConnection"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Messaging not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messaging/connections/{id}/verify:
    post:
      operationId: verifyMessagingConnection
      tags: [messaging]
      summary: Complete OTP verification for a channel connection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyMessagingConnectionInput"
      responses:
        "200":
          description: Verified connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConnection"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Connection not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /messaging/connections/{id}:
    delete:
      operationId: deleteMessagingConnection
      tags: [messaging]
      summary: Disconnect (delete) a channel connection
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /blog/subscribe:
    post:
      operationId: subscribeToBlog
      tags: [blog]
      summary: Subscribe an email address to the blog newsletter
      description: |
        Public endpoint. Captures an email address with the originating
        surface (e.g. `blog-post-footer`, `blog-index`, `home-blog-preview`)
        for attribution. Idempotent: re-subscribing an existing email returns
        success without creating a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogSubscribeInput"
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogSubscribeResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/agents/smoke-test:
    post:
      operationId: smokeTestAgents
      tags: [admin]
      summary: Smoke-test every agent (admin only)
      responses:
        "200":
          description: Smoke test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmokeTestReport"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        fullName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, clerkId, email, createdAt]
    Business:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        slug:
          type: string
        industry:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        brandColor:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, ownerId, name, slug, createdAt, updatedAt]
    UpdateBusinessBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        industry:
          type: string
          maxLength: 200
        websiteUrl:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        brandColor:
          type: string
          maxLength: 32
        logoUrl:
          type: string
          maxLength: 500
    AgentSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [structured, text]
      required: [id, name, description, mode]
    AgentInputField:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [string, textarea, number, integer, enum, string-array]
        required:
          type: boolean
        description:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true
        options:
          type: array
          items:
            type: string
          nullable: true
        defaultValue:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        step:
          type: number
          nullable: true
      required: [name, label, type, required]
    AgentDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [structured, text]
        promptVersion:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AgentInputField"
      required: [id, name, description, mode, promptVersion, fields]
    DashboardKpis:
      type: object
      properties:
        runsThisWeek:
          type: integer
        runsTotal:
          type: integer
        activeAgents:
          type: integer
        revenueLeaksIdentified:
          type: integer
        conversations:
          type: integer
      required:
        [runsThisWeek, runsTotal, activeAgents, revenueLeaksIdentified, conversations]
    DashboardSuggestion:
      type: object
      properties:
        text:
          type: string
        agentSlug:
          type: string
          nullable: true
        runId:
          type: string
          nullable: true
        source:
          type: string
      required: [text, source]
    DashboardSummary:
      type: object
      properties:
        business:
          $ref: "#/components/schemas/Business"
        kpis:
          $ref: "#/components/schemas/DashboardKpis"
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        suggestedActions:
          type: array
          items:
            $ref: "#/components/schemas/DashboardSuggestion"
      required: [business, kpis, recentRuns, suggestedActions]
    SearchAgentHit:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required: [id, name, description]
    SearchRunHit:
      type: object
      properties:
        id:
          type: string
        agentSlug:
          type: string
        agentName:
          type: string
        status:
          type: string
        preview:
          type: string
        startedAt:
          type: string
          format: date-time
      required: [id, agentSlug, agentName, status, preview, startedAt]
    SearchConversationHit:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        channel:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, title, channel, updatedAt]
    SearchSettingHit:
      type: object
      properties:
        label:
          type: string
        href:
          type: string
        description:
          type: string
      required: [label, href, description]
    SearchResults:
      type: object
      properties:
        query:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/SearchAgentHit"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/SearchRunHit"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/SearchConversationHit"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SearchSettingHit"
      required: [query, agents, runs, conversations, settings]
    RunAgentRequest:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
      required: [input]
    AgentRun:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        userId:
          type: string
        agentSlug:
          type: string
        status:
          type: string
        input:
          type: object
          additionalProperties: true
          nullable: true
        output:
          type: object
          additionalProperties: true
          nullable: true
        errorMessage:
          type: string
          nullable: true
        tokensUsed:
          type: integer
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, businessId, userId, agentSlug, status, startedAt]
    ServiceStatusValue:
      type: string
      enum: [ok, configured, not_configured, error]
    PublicStatusValue:
      type: string
      enum: [configured, not_configured]
    PublicConfig:
      type: object
      properties:
        stripe:
          type: object
          properties:
            auditLink:
              type: string
              nullable: true
            engineLink:
              type: string
              nullable: true
          required: [auditLink, engineLink]
        cal:
          type: object
          properties:
            link:
              type: string
              nullable: true
          required: [link]
        status:
          type: object
          properties:
            stripe:
              $ref: "#/components/schemas/PublicStatusValue"
            cal:
              $ref: "#/components/schemas/PublicStatusValue"
          required: [stripe, cal]
      required: [stripe, cal, status]
    ServiceStatus:
      type: object
      properties:
        api:
          $ref: "#/components/schemas/ServiceStatusValue"
        database:
          $ref: "#/components/schemas/ServiceStatusValue"
        ai_provider:
          $ref: "#/components/schemas/ServiceStatusValue"
        stripe:
          $ref: "#/components/schemas/ServiceStatusValue"
        cal_link:
          $ref: "#/components/schemas/ServiceStatusValue"
        messaging:
          type: object
          properties:
            twilio:
              $ref: "#/components/schemas/ServiceStatusValue"
            whatsapp:
              $ref: "#/components/schemas/ServiceStatusValue"
            sms:
              $ref: "#/components/schemas/ServiceStatusValue"
          required: [twilio, whatsapp, sms]
      required:
        [api, database, ai_provider, stripe, cal_link, messaging]
    SmokeTestResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, not_configured]
        latencyMs:
          type: integer
        error:
          type: string
          nullable: true
        preview:
          type: string
          nullable: true
      required: [id, name, status, latencyMs]
    AssistantAgentMode:
      type: string
      enum:
        [general, revenue_recovery, outbound_sales, follow_up, proposal, seo_content]
    AssistantConversation:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        userId:
          type: string
        title:
          type: string
          nullable: true
        channel:
          type: string
        agentMode:
          $ref: "#/components/schemas/AssistantAgentMode"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, businessId, userId, channel, agentMode, createdAt, updatedAt]
    AssistantMessage:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        userId:
          type: string
        businessId:
          type: string
        channel:
          type: string
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        agentMode:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [id, conversationId, userId, businessId, channel, role, content, createdAt]
    AssistantConversationWithMessages:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/AssistantConversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
      required: [conversation, messages]
    CreateAssistantConversationInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        agentMode:
          $ref: "#/components/schemas/AssistantAgentMode"
    PostAssistantMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        agentMode:
          $ref: "#/components/schemas/AssistantAgentMode"
        regenerate:
          type: boolean
          description: When true, the previous assistant message is replaced rather than a new user message being appended.
      required: [content]
    AssistantMessagePairResponse:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/AssistantConversation"
        userMessage:
          $ref: "#/components/schemas/AssistantMessage"
          nullable: true
        assistantMessage:
          $ref: "#/components/schemas/AssistantMessage"
        suggestedActions:
          type: array
          items:
            type: string
      required: [conversation, assistantMessage]
    SmokeTestReport:
      type: object
      properties:
        runAt:
          type: string
          format: date-time
        passed:
          type: integer
        failed:
          type: integer
        notConfigured:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SmokeTestResult"
      required: [runAt, passed, failed, notConfigured, results]
    MessagingChannel:
      type: string
      enum: [whatsapp, sms]
    MessagingConnection:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        userId:
          type: string
        channel:
          $ref: "#/components/schemas/MessagingChannel"
        phoneNumber:
          type: string
        label:
          type: string
          nullable: true
        verified:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, businessId, userId, channel, phoneNumber, verified, createdAt, updatedAt]
    CreateMessagingConnectionInput:
      type: object
      properties:
        channel:
          $ref: "#/components/schemas/MessagingChannel"
        phoneNumber:
          type: string
          description: E.164 phone number, e.g. +14155551234
        label:
          type: string
          nullable: true
      required: [channel, phoneNumber]
    BlogSubscribeInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        source:
          type: string
          description: Where the form was submitted from, used for attribution.
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
      required: [email, source]
    BlogSubscribeResponse:
      type: object
      properties:
        ok:
          type: boolean
        alreadySubscribed:
          type: boolean
      required: [ok, alreadySubscribed]
    VerifyMessagingConnectionInput:
      type: object
      properties:
        code:
          type: string
          description: 6-digit numeric verification code
          pattern: "^[0-9]{6}$"
          minLength: 6
          maxLength: 6
      required: [code]
