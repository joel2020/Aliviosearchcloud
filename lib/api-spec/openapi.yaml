openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Alivio Search Cloud customer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and current user
  - name: businesses
    description: Business workspace operations
  - name: agents
    description: AI agent execution
  - name: agent-runs
    description: Agent run history
  - name: status
    description: Service status
  - name: admin
    description: Admin-only endpoints
  - name: dashboard
    description: Customer dashboard summary
  - name: search
    description: Cross-workspace search
  - name: assistant
    description: Business Assistant chat
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /status:
    get:
      operationId: getStatus
      tags: [status]
      summary: Service status overview
      description: Returns the configured/connected status of every backing service. Never returns secret values.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current authenticated user
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /businesses/current:
    get:
      operationId: getCurrentBusiness
      tags: [businesses]
      summary: Current business workspace
      responses:
        "200":
          description: Current business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateCurrentBusiness
      tags: [businesses]
      summary: Update the current business workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessBody"
      responses:
        "200":
          description: Updated business
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Business"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all available agents
      responses:
        "200":
          description: Agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/{id}:
    get:
      operationId: getAgent
      tags: [agents]
      summary: Get agent metadata including dynamic form fields
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentDetail"
        "400":
          description: Invalid params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Customer dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search:
    get:
      operationId: searchWorkspace
      tags: [search]
      summary: Search agents, runs, conversations, and settings
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agents/{id}/run:
    post:
      operationId: runAgent
      tags: [agents]
      summary: Run an agent
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunAgentRequest"
      responses:
        "200":
          description: Agent run record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs:
    get:
      operationId: listAgentRuns
      tags: [agent-runs]
      summary: List recent agent runs for the current business
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - in: query
          name: agentId
          schema:
            type: string
      responses:
        "200":
          description: Agent runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentRun"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /agent-runs/{id}:
    get:
      operationId: getAgentRun
      tags: [agent-runs]
      summary: Single agent run
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/conversations:
    get:
      operationId: listAssistantConversations
      tags: [assistant]
      summary: List the current user's assistant conversations
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssistantConversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAssistantConversation
      tags: [assistant]
      summary: Create a new assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssistantConversationInput"
      responses:
        "200":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversation"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/conversations/{id}:
    get:
      operationId: getAssistantConversation
      tags: [assistant]
      summary: Get a single conversation with all of its messages
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAssistantConversation
      tags: [assistant]
      summary: Soft-delete a conversation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assistant/conversations/{id}/messages:
    post:
      operationId: postAssistantMessage
      tags: [assistant]
      summary: Send a user message and get the assistant reply
      description: |
        Persists the user message, runs the Business Assistant agent against
        full business context, persists the assistant reply, and returns the
        updated message pair. SSE streaming may be added behind the same path
        in a future revision; this JSON variant is the always-supported fallback.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAssistantMessageInput"
      responses:
        "200":
          description: User + assistant message pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMessagePairResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Assistant not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/agents/smoke-test:
    post:
      operationId: smokeTestAgents
      tags: [admin]
      summary: Smoke-test every agent (admin only)
      responses:
        "200":
          description: Smoke test results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmokeTestReport"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden — not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error]
    CurrentUser:
      type: object
      properties:
        id:
          type: string
        clerkId:
          type: string
        email:
          type: string
        fullName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, clerkId, email, createdAt]
    Business:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        slug:
          type: string
        industry:
          type: string
          nullable: true
        websiteUrl:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        brandColor:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, ownerId, name, slug, createdAt, updatedAt]
    UpdateBusinessBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        industry:
          type: string
          maxLength: 200
        websiteUrl:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 2000
        brandColor:
          type: string
          maxLength: 32
        logoUrl:
          type: string
          maxLength: 500
    AgentSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [structured, text]
      required: [id, name, description, mode]
    AgentInputField:
      type: object
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum: [string, textarea, number, integer, enum, string-array]
        required:
          type: boolean
        description:
          type: string
          nullable: true
        placeholder:
          type: string
          nullable: true
        options:
          type: array
          items:
            type: string
          nullable: true
        defaultValue:
          nullable: true
          oneOf:
            - type: string
            - type: number
            - type: array
              items:
                type: string
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        step:
          type: number
          nullable: true
      required: [name, label, type, required]
    AgentDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [structured, text]
        promptVersion:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AgentInputField"
      required: [id, name, description, mode, promptVersion, fields]
    DashboardKpis:
      type: object
      properties:
        runsThisWeek:
          type: integer
        runsTotal:
          type: integer
        activeAgents:
          type: integer
        revenueLeaksIdentified:
          type: integer
        conversations:
          type: integer
      required:
        [runsThisWeek, runsTotal, activeAgents, revenueLeaksIdentified, conversations]
    DashboardSuggestion:
      type: object
      properties:
        text:
          type: string
        agentSlug:
          type: string
          nullable: true
        runId:
          type: string
          nullable: true
        source:
          type: string
      required: [text, source]
    DashboardSummary:
      type: object
      properties:
        business:
          $ref: "#/components/schemas/Business"
        kpis:
          $ref: "#/components/schemas/DashboardKpis"
        recentRuns:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
        suggestedActions:
          type: array
          items:
            $ref: "#/components/schemas/DashboardSuggestion"
      required: [business, kpis, recentRuns, suggestedActions]
    SearchAgentHit:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required: [id, name, description]
    SearchRunHit:
      type: object
      properties:
        id:
          type: string
        agentSlug:
          type: string
        agentName:
          type: string
        status:
          type: string
        preview:
          type: string
        startedAt:
          type: string
          format: date-time
      required: [id, agentSlug, agentName, status, preview, startedAt]
    SearchConversationHit:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        channel:
          type: string
        updatedAt:
          type: string
          format: date-time
      required: [id, title, channel, updatedAt]
    SearchSettingHit:
      type: object
      properties:
        label:
          type: string
        href:
          type: string
        description:
          type: string
      required: [label, href, description]
    SearchResults:
      type: object
      properties:
        query:
          type: string
        agents:
          type: array
          items:
            $ref: "#/components/schemas/SearchAgentHit"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/SearchRunHit"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/SearchConversationHit"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/SearchSettingHit"
      required: [query, agents, runs, conversations, settings]
    RunAgentRequest:
      type: object
      properties:
        input:
          type: object
          additionalProperties: true
      required: [input]
    AgentRun:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        userId:
          type: string
        agentSlug:
          type: string
        status:
          type: string
        input:
          type: object
          additionalProperties: true
          nullable: true
        output:
          type: object
          additionalProperties: true
          nullable: true
        errorMessage:
          type: string
          nullable: true
        tokensUsed:
          type: integer
          nullable: true
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
      required: [id, businessId, userId, agentSlug, status, startedAt]
    ServiceStatusValue:
      type: string
      enum: [ok, configured, not_configured, error]
    ServiceStatus:
      type: object
      properties:
        api:
          $ref: "#/components/schemas/ServiceStatusValue"
        database:
          $ref: "#/components/schemas/ServiceStatusValue"
        ai_provider:
          $ref: "#/components/schemas/ServiceStatusValue"
        stripe:
          $ref: "#/components/schemas/ServiceStatusValue"
        cal_link:
          $ref: "#/components/schemas/ServiceStatusValue"
        messaging:
          type: object
          properties:
            twilio:
              $ref: "#/components/schemas/ServiceStatusValue"
            whatsapp:
              $ref: "#/components/schemas/ServiceStatusValue"
          required: [twilio, whatsapp]
      required:
        [api, database, ai_provider, stripe, cal_link, messaging]
    SmokeTestResult:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [pass, fail, not_configured]
        latencyMs:
          type: integer
        error:
          type: string
          nullable: true
        preview:
          type: string
          nullable: true
      required: [id, name, status, latencyMs]
    AssistantAgentMode:
      type: string
      enum:
        [general, revenue_recovery, outbound_sales, follow_up, proposal, seo_content]
    AssistantConversation:
      type: object
      properties:
        id:
          type: string
        businessId:
          type: string
        userId:
          type: string
        title:
          type: string
          nullable: true
        channel:
          type: string
        agentMode:
          $ref: "#/components/schemas/AssistantAgentMode"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        [id, businessId, userId, channel, agentMode, createdAt, updatedAt]
    AssistantMessage:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        userId:
          type: string
        businessId:
          type: string
        channel:
          type: string
        role:
          type: string
          enum: [user, assistant, system, tool]
        content:
          type: string
        agentMode:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        [id, conversationId, userId, businessId, channel, role, content, createdAt]
    AssistantConversationWithMessages:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/AssistantConversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AssistantMessage"
      required: [conversation, messages]
    CreateAssistantConversationInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        agentMode:
          $ref: "#/components/schemas/AssistantAgentMode"
    PostAssistantMessageInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        agentMode:
          $ref: "#/components/schemas/AssistantAgentMode"
        regenerate:
          type: boolean
          description: When true, the previous assistant message is replaced rather than a new user message being appended.
      required: [content]
    AssistantMessagePairResponse:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/AssistantConversation"
        userMessage:
          $ref: "#/components/schemas/AssistantMessage"
          nullable: true
        assistantMessage:
          $ref: "#/components/schemas/AssistantMessage"
        suggestedActions:
          type: array
          items:
            type: string
      required: [conversation, assistantMessage]
    SmokeTestReport:
      type: object
      properties:
        runAt:
          type: string
          format: date-time
        passed:
          type: integer
        failed:
          type: integer
        notConfigured:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SmokeTestResult"
      required: [runAt, passed, failed, notConfigured, results]
